name: Streakflow Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "02_cicd/streakflow-fullstack/backend/**"
      - ".github/workflows/streakflow-backend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build --no-cache \
            -t ${{ secrets.DOCKER_USERNAME }}/streakflow-backend:latest \
            ./02_cicd/streakflow-fullstack/backend

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/streakflow-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STREAKFLOW_BACKEND_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: STREAKFLOW_ENV_FILE
          script: |
            # Create .env file on EC2 from GitHub secret
            echo "$STREAKFLOW_ENV_FILE" > ~/streakflow-backend.env

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/streakflow-backend:latest

            sudo docker stop streakflow-backend || true
            sudo docker rm streakflow-backend || true

            sudo docker run -d \
              --name streakflow-backend \
              --restart unless-stopped \
              --env-file ~/streakflow-backend.env \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/streakflow-backend:latest
        env:
          STREAKFLOW_ENV_FILE: ${{ secrets.STREAKFLOW_ENV_FILE }}